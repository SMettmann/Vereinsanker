name: STRATO Registrierungs-Hotfix

on:
  push:
    paths:
      - ".github/workflows/strato-registration-hotfix.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hotfix packen
        run: |
          mkdir -p hotfix
          cp app.js start.html login.html forgot-password.html reset-password.html onboarding.html hotfix/
      - uses: actions/upload-artifact@v4
        with:
          name: Vereinsfach_STRATO_Hotfix_Registrierung
          path: hotfix/
          retention-days: 2
