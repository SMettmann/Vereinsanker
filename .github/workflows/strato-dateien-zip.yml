name: STRATO Dateien als ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/strato-dateien-zip.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4
      - name: ZIP mit Website-Dateien bauen
        run: |
          zip -9 VEREINSFACH_STRATO_Monats_Jahresbeitraege_mit_Handbuch.zip \
            app.js features.js finance.js contribution-types.js \
            join-public.js joins.js standard-beitritt.js settings.html \
            handbuch.html handbuch.js
          unzip -l VEREINSFACH_STRATO_Monats_Jahresbeitraege_mit_Handbuch.zip
      - name: ZIP bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: VEREINSFACH_STRATO_mit_Handbuch
          path: VEREINSFACH_STRATO_Monats_Jahresbeitraege_mit_Handbuch.zip
          if-no-files-found: error
          retention-days: 30
