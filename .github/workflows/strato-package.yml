name: STRATO Uploadpaket

on:
  push:
    paths:
      - ".github/workflows/strato-package.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: STRATO-Paket bauen
        run: |
          mkdir -p dist
          find . -maxdepth 1 -type f -print0 | xargs -0 -I{} cp "{}" dist/

      - name: Uploadpaket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Vereinsfach_STRATO_Upload
          path: dist/
          if-no-files-found: error
          retention-days: 3
